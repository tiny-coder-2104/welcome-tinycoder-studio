<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact TinyCoder Studio — leave your email and a short message. Davao City, Philippines." />
    <title>Contact us • TinyCoder Studio</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a class="brand" href="/">TinyCoder Studio</a>
        <span class="location">🇵🇭 Davao City, PH</span>
      </nav>
    </header>

    <main class="intake-page">
      <h1>Contact us</h1>
      <p class="sub">Leave your email and a short message — we'll reply within 1 business day.</p>

      <form id="contact-form">
        <label>Name *
          <input name="name" required maxlength="200" autocomplete="name" placeholder="Ana Cruz" />
        </label>
        <label>Email *
          <input name="email" type="email" required maxlength="200" autocomplete="email" placeholder="ana@example.com" />
        </label>
        <label>Message *
          <textarea name="message" required minlength="20" maxlength="1000" placeholder="Questions, feedback, or anything else — at least 20 characters."></textarea>
        </label>
        <button type="submit">Send message</button>
        <p class="status" id="contact-status" role="status" aria-live="polite"></p>
      </form>

      <p class="alt"><a href="/">Prefer to talk it through? → Ask the concierge</a></p>
    </main>

    <footer>© 2026 TinyCoder Studio • Virtual Office • Davao City, PH</footer>

    <script type="module">
      // 0063: contact form → POST {contact} to /api/chat contact branch.
      // Sends ONLY name/email/message — type/source/stage/priority forced server-side.
      const form = document.getElementById('contact-form');
      const status = document.getElementById('contact-status');

      form.addEventListener('submit', async e => {
        e.preventDefault();
        const contact = Object.fromEntries(new FormData(form));
        status.textContent = 'Sending…';
        status.className = 'status';
        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contact })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            status.textContent = data.text || 'Something went wrong — please try again.';
            status.className = 'status err';
            return;
          }
          status.textContent = data.text;
          form.reset();
        } catch {
          status.textContent = 'Something went wrong — please try again, or ask the concierge.';
          status.className = 'status err';
        }
      });
    </script>
  </body>
</html>
